name: Build and Release
run-name: Build and Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag if not exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.get_version.outputs.version }}
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git tag $TAG || true
          git push origin $TAG || true

      - name: Generate packaged online runtime config
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || secrets.MONGODB_DB || 'POSmaster' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          POS_ORG_ID: ${{ vars.POS_ORG_ID || 'default-org' }}
          ONLINE_API_HOST: ${{ vars.ONLINE_API_HOST || '127.0.0.1' }}
          ONLINE_API_PORT: ${{ vars.ONLINE_API_PORT || '4100' }}
          ONLINE_API_CORS_ORIGIN: ${{ vars.ONLINE_API_CORS_ORIGIN || '*' }}
          POS_ONLINE_CLIENT_HOST: ${{ vars.POS_ONLINE_CLIENT_HOST || '127.0.0.1' }}
        run: node scripts/write-online-runtime-config.cjs

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

  build-mac:
    needs: build-windows
    runs-on: macos-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate packaged online runtime config
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || secrets.MONGODB_DB || 'POSmaster' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          POS_ORG_ID: ${{ vars.POS_ORG_ID || 'default-org' }}
          ONLINE_API_HOST: ${{ vars.ONLINE_API_HOST || '127.0.0.1' }}
          ONLINE_API_PORT: ${{ vars.ONLINE_API_PORT || '4100' }}
          ONLINE_API_CORS_ORIGIN: ${{ vars.ONLINE_API_CORS_ORIGIN || '*' }}
          POS_ONLINE_CLIENT_HOST: ${{ vars.POS_ONLINE_CLIENT_HOST || '127.0.0.1' }}
        run: node scripts/write-online-runtime-config.cjs

      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v1.0.1, etc.

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

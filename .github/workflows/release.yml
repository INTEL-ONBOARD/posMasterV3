name: Build and Release
run-name: Build and Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag if not exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.get_version.outputs.version }}
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git tag $TAG || true
          git push origin $TAG || true

      - name: Generate packaged online runtime config
        shell: bash
        env:
          # Remote mode: the desktop is a thin client. Only the server URLs and
          # (optionally) the CA filename are baked in. NO secrets ship to tills;
          # MONGODB_URI/JWT_SECRET/TEA_COOP_* live only on the central server.
          POS_ONLINE_API_URL: ${{ vars.POS_ONLINE_API_URL || 'https://37.60.226.84:4100/api' }}
          POS_ONLINE_REALTIME_URL: ${{ vars.POS_ONLINE_REALTIME_URL || 'https://37.60.226.84:4100' }}
          POS_TLS_CA_FILE: ${{ vars.POS_TLS_CA_FILE || 'pos-ca.pem' }}
          POS_ORG_ID: ${{ vars.POS_ORG_ID || 'default-org' }}
        run: node scripts/write-online-runtime-config.cjs

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

  build-mac:
    needs: build-windows
    runs-on: macos-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate packaged online runtime config
        shell: bash
        env:
          # Remote mode: the desktop is a thin client. Only the server URLs and
          # (optionally) the CA filename are baked in. NO secrets ship to tills;
          # MONGODB_URI/JWT_SECRET/TEA_COOP_* live only on the central server.
          POS_ONLINE_API_URL: ${{ vars.POS_ONLINE_API_URL || 'https://37.60.226.84:4100/api' }}
          POS_ONLINE_REALTIME_URL: ${{ vars.POS_ONLINE_REALTIME_URL || 'https://37.60.226.84:4100' }}
          POS_TLS_CA_FILE: ${{ vars.POS_TLS_CA_FILE || 'pos-ca.pem' }}
          POS_ORG_ID: ${{ vars.POS_ORG_ID || 'default-org' }}
        run: node scripts/write-online-runtime-config.cjs

      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          release_name: ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false

  build-windows:
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate packaged online runtime config
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || secrets.MONGODB_DB || 'POSmaster' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          POS_ORG_ID: ${{ vars.POS_ORG_ID || 'default-org' }}
          ONLINE_API_HOST: ${{ vars.ONLINE_API_HOST || '127.0.0.1' }}
          ONLINE_API_PORT: ${{ vars.ONLINE_API_PORT || '4100' }}
          ONLINE_API_CORS_ORIGIN: ${{ vars.ONLINE_API_CORS_ORIGIN || '*' }}
          POS_ONLINE_CLIENT_HOST: ${{ vars.POS_ONLINE_CLIENT_HOST || '127.0.0.1' }}
        run: node scripts/write-online-runtime-config.cjs

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

  build-mac:
    needs: create-release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: posMasterV3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: posMasterV3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate packaged online runtime config
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || secrets.MONGODB_DB || 'POSmaster' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          POS_ORG_ID: ${{ vars.POS_ORG_ID || 'default-org' }}
          ONLINE_API_HOST: ${{ vars.ONLINE_API_HOST || '127.0.0.1' }}
          ONLINE_API_PORT: ${{ vars.ONLINE_API_PORT || '4100' }}
          ONLINE_API_CORS_ORIGIN: ${{ vars.ONLINE_API_CORS_ORIGIN || '*' }}
          POS_ONLINE_CLIENT_HOST: ${{ vars.POS_ONLINE_CLIENT_HOST || '127.0.0.1' }}
        run: node scripts/write-online-runtime-config.cjs

      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
